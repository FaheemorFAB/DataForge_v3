services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env

    volumes:
      - ./backend/instance:/app/backend/instance

    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend
      - DATAFORGE_PROJECTS_DIR=/app/backend/instance/projects

    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Use --pool=solo on Windows; use --pool=prefork on Linux/macOS
    command: >
      celery --app=dataforge.web.tasks:celery worker
      --loglevel=info
      --pool=solo
      --queues=celery
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend
      - DATAFORGE_PROJECTS_DIR=/app/backend/instance/projects
    volumes:
      - ./backend/instance:/app/backend/instance
    depends_on:
      - redis

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery --app=dataforge.web.tasks:celery beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend
      - DATAFORGE_PROJECTS_DIR=/app/backend/instance/projects
    depends_on:
      - redis

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery --app=dataforge.web.tasks:celery flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend
      - DATAFORGE_PROJECTS_DIR=/app/backend/instance/projects
    depends_on:
      - redis
