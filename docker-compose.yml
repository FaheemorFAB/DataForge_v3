services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command:
      [
        "gunicorn",
        "--worker-class",
        "gthread",
        "--threads",
        "4",
        "--workers",
        "1",
        "--bind",
        "0.0.0.0:5001",
        "services.auth.wsgi:app",
      ]
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5000}
      PORT: 5001
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command:
      [
        "gunicorn",
        "--worker-class",
        "eventlet",
        "-w",
        "1",
        "--bind",
        "0.0.0.0:5000",
        "services.web.wsgi:app",
      ]
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5000}
      REDIS_URL: redis://redis:6379/0
      SOCKETIO_ASYNC_MODE: eventlet
      DATAFORGE_INSTANCE_DIR: /data/instance
      DATAFORGE_PROJECTS_DIR: /data/instance/projects
      DATAFORGE_STORE_DIR: /data/store
    volumes:
      - dataforge_instance:/data/instance
      - dataforge_store:/data/store
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command:
      [
        "celery",
        "--app=services.web.tasks:celery",
        "worker",
        "--loglevel=info",
        "--pool=prefork",
        "--queues=celery",
      ]
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5000}
      REDIS_URL: redis://redis:6379/0
      DATAFORGE_INSTANCE_DIR: /data/instance
      DATAFORGE_PROJECTS_DIR: /data/instance/projects
      DATAFORGE_STORE_DIR: /data/store
    volumes:
      - dataforge_instance:/data/instance
      - dataforge_store:/data/store
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command: ["celery", "--app=services.web.tasks:celery", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5000}
      REDIS_URL: redis://redis:6379/0
      DATAFORGE_INSTANCE_DIR: /data/instance
      DATAFORGE_PROJECTS_DIR: /data/instance/projects
      DATAFORGE_STORE_DIR: /data/store
    volumes:
      - dataforge_instance:/data/instance
      - dataforge_store:/data/store
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command: ["celery", "--app=services.web.tasks:celery", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dataforge_instance:
  dataforge_store:
